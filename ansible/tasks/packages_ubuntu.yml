---
- name: Install Ubuntu CLI packages
  ansible.builtin.apt:
    name: "{{ ubuntu_cli_packages }}"
    state: present
    update_cache: true
  become: true

- name: Validate Ubuntu version for mise apt repository
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_version'] is version('22.04', '>=')
    fail_msg: "mise apt installation via extrepo requires Ubuntu 22.04 or newer."

- name: Install mise apt repository helper
  ansible.builtin.apt:
    name:
      - ca-certificates
      - extrepo
    state: present
    update_cache: true
  become: true

- name: Check whether mise apt source is enabled
  ansible.builtin.shell: grep -R "mise.jdx.dev\|jdxcode" /etc/apt/sources.list /etc/apt/sources.list.d >/dev/null 2>&1
  register: mise_apt_source_check
  changed_when: false
  failed_when: false

- name: Enable mise apt source
  ansible.builtin.command:
    argv:
      - extrepo
      - enable
      - mise
  become: true
  when: mise_apt_source_check.rc != 0

- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: true
  become: true
